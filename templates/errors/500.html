{% extends "base.html" %}
{% block title %}Something Went Wrong - FoodieHub{% endblock %}
{% block content %}
<div class="fh-error-page">
  <div>

    <h3 class="mb-2">Our kitchen hit a snag.</h3>

    <a href="{{ url_for('index') }}" class="fh-btn fh-btn-primary">Back to Home</a>
  </div>
</div>
{% endblock %}
